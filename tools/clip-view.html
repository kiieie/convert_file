<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Clip Meme - ConvertFile</title>
    <link rel="stylesheet" href="/css/modern-theme.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center;
               min-height: 100vh; margin: 0; background: var(--slate-50); padding: 16px; box-sizing: border-box; }
        .clip-frame { width: min(720px, 100%); border-radius: 12px; overflow: hidden;
                      box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
        .yt-player-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
        .yt-player-box iframe, .yt-player-box > div { position: absolute; inset: 0; width: 100%; height: 100%; }
        .meme-bar { background: #FFFFFF; color: #000000; text-align: center;
                    font-family: Impact, "Arial Black", sans-serif; font-size: clamp(18px, 4vw, 32px);
                    padding: 10px 14px; line-height: 1.15; word-break: break-word; }
        .clip-error { color: #dc2626; font-size: 15px; text-align: center; }
        .clip-footer { margin-top: 14px; font-size: 13px; }
        .clip-footer a { color: #2563eb; }
    </style>
</head>
<body>
    <div class="clip-frame" id="clip-frame" hidden>
        <div class="meme-bar" id="bar-top" hidden></div>
        <div class="yt-player-box"><div id="yt-player"></div></div>
        <div class="meme-bar" id="bar-bottom" hidden></div>
    </div>
    <p class="clip-error" id="clip-error" hidden>Invalid or broken clip link.</p>
    <p class="clip-footer">⚡ Make your own — <a href="/tools/yt-meme.html">ConvertFile YouTube Meme Maker</a></p>

    <script src="/js/core/yt-utils.js?v=1"></script>
    <script src="/js/tools/clip-view.js?v=1"></script>
</body>
</html>
